<!doctype html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bangkom Subtitle Tool</title>

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">

        <!-- Tailwind -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

        <script>
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ['Inter', 'Sarabun', 'sans-serif'],
                        },
                    }
                }
            };
        </script>

        <style>
            .glass {
                background: rgba(255, 255, 255, 0.7);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.2);
            }
            .dark .glass {
                background: rgba(30, 41, 59, 0.7);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
            .toggle-dot {
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            input:checked ~ .toggle-dot {
                transform: translateX(100%);
            }
            .preview-scroll::-webkit-scrollbar {
                width: 6px;
            }
            .preview-scroll::-webkit-scrollbar-thumb {
                background-color: rgba(156, 163, 175, 0.5);
                border-radius: 10px;
            }
        </style>
    </head>

    <body class="bg-slate-50 dark:bg-slate-950 min-h-screen font-sans transition-colors duration-300">
        <div class="container mx-auto px-4 py-12 flex items-center justify-center min-h-screen">
            <div class="w-full max-w-2xl glass dark:glass rounded-3xl shadow-2xl p-8 transition-all duration-300 border border-slate-200 dark:border-slate-800">
                
                <!-- Header -->
                <div class="flex justify-between items-center mb-10">
                    <div class="flex items-center gap-3">
                        <div class="bg-indigo-600 p-3 rounded-2xl shadow-lg shadow-indigo-200 dark:shadow-none">
                            <i class="fa-solid fa-headphones-simple text-white text-xl"></i>
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold text-slate-800 dark:text-white tracking-tight">Bangkom</h1>
                            <p class="text-xs text-slate-500 dark:text-slate-400 font-medium uppercase tracking-wider">AI Subtitle Tool</p>
                        </div>
                    </div>

                    <!-- Theme Toggle -->
                    <button id="themeToggle" onclick="toggleDark()" class="w-14 h-8 bg-slate-200 dark:bg-slate-700 rounded-full p-1 relative transition-colors duration-300">
                        <div id="toggleDot" class="w-6 h-6 bg-white dark:bg-indigo-400 rounded-full shadow-md transform transition-transform duration-300 flex items-center justify-center">
                            <i id="themeIcon" class="fa-solid fa-sun text-[10px] text-amber-500 dark:text-white"></i>
                        </div>
                    </button>
                </div>

                <!-- Dropzone -->
                <div
                    id="dropzone"
                    class="group relative border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl p-10 text-center cursor-pointer hover:border-indigo-500 dark:hover:border-indigo-400 hover:bg-indigo-50/30 dark:hover:bg-indigo-950/20 transition-all duration-300"
                >
                    <div class="relative z-10">
                        <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform duration-300">
                            <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-400 group-hover:text-indigo-500"></i>
                        </div>
                        <p class="text-slate-600 dark:text-slate-300 font-medium">ลากไฟล์เสียงหรือวิดีโอมาวางที่นี่</p>
                        <p class="text-xs text-slate-400 mt-1">หรือคลิกเพื่อเลือกไฟล์จากเครื่อง</p>
                        <p id="fileName" class="mt-4 text-sm font-semibold text-indigo-600 dark:text-indigo-400 truncate"></p>
                    </div>
                    <input type="file" id="file" class="hidden" accept="audio/*,video/*" />
                </div>

                <!-- Settings Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mt-8">
                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase ml-1">Words Per Line</label>
                        <div class="relative">
                            <i class="fa-solid fa-align-left absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                            <input
                                id="words"
                                type="number"
                                value="1"
                                min="1"
                                class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all dark:text-white"
                            />
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase ml-1">Output Format</label>
                        <div class="relative">
                            <i class="fa-solid fa-file-export absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                            <select id="format" class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none appearance-none dark:text-white transition-all">
                                <option value="txt">TXT (Plain Text)</option>
                                <option value="srt">SRT (Subtitles)</option>
                            </select>
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase ml-1">Whisper Model</label>
                        <div class="relative">
                            <i class="fa-solid fa-brain absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                            <select id="model" class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none appearance-none dark:text-white transition-all">
                                <option value="base">Base (Fastest)</option>
                                <option value="small">Small</option>
                                <option value="medium">Medium (Stable)</option>
                                <option value="large-v3-turbo" selected>Large V3 Turbo (Recommended)</option>
                                <option value="large-v3">Large V3 (Best Accuracy)</option>
                            </select>
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase ml-1">Language</label>
                        <div class="relative">
                            <i class="fa-solid fa-language absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                            <select id="language" class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none appearance-none dark:text-white transition-all">
                                <option value="auto">Auto Detect</option>
                                <option value="th">Thai</option>
                                <option value="en">English</option>
                                <option value="ja">Japanese</option>
                                <option value="zh">Chinese</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-3 mt-10">
                    <button onclick="upload()" id="btn" class="flex-[2] bg-indigo-600 text-white font-bold py-3.5 rounded-2xl hover:bg-indigo-700 shadow-lg shadow-indigo-200 dark:shadow-none transition-all duration-300 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-play text-xs"></i>
                        Start Transcription
                    </button>
                    <button onclick="cancel()" id="stopBtn" class="hidden flex-1 bg-rose-500 text-white font-bold py-3.5 rounded-2xl hover:bg-rose-600 transition-all duration-300 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-stop text-xs"></i>
                        Stop
                    </button>
                </div>

                <!-- Progress Section -->
                <div id="progressSection" class="hidden mt-8 p-6 bg-slate-50 dark:bg-slate-900/50 rounded-2xl border border-slate-200 dark:border-slate-800">
                    <div class="flex justify-between items-end mb-3">
                        <span id="status" class="text-sm font-semibold text-slate-600 dark:text-slate-300">Preparing...</span>
                        <span id="percentText" class="text-xs font-bold text-indigo-600 dark:text-indigo-400">0%</span>
                    </div>
                    <div class="w-full bg-slate-200 dark:bg-slate-800 rounded-full h-3 overflow-hidden">
                        <div id="progressFill" class="bg-indigo-600 h-full w-0 transition-all duration-300 rounded-full shadow-[0_0_10px_rgba(79,70,229,0.5)]"></div>
                    </div>
                </div>

                <!-- Result Section -->
                <div id="resultSection" class="hidden mt-8 space-y-4 animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <div class="flex items-center justify-between">
                        <h3 class="text-sm font-bold text-slate-500 uppercase tracking-widest">Transcription Preview</h3>
                        <a id="download" href="#" class="inline-flex items-center gap-2 text-indigo-600 dark:text-indigo-400 font-bold text-sm hover:underline" target="_blank">
                            <i class="fa-solid fa-download"></i> Download Full File
                        </a>
                    </div>
                    <div class="relative group">
                        <pre id="preview" class="preview-scroll bg-slate-900 text-slate-300 p-5 rounded-2xl text-[11px] leading-relaxed max-h-56 overflow-auto border border-slate-800 font-mono"></pre>
                        <div class="absolute inset-x-0 bottom-0 h-12 bg-gradient-to-t from-slate-900 to-transparent rounded-b-2xl pointer-events-none"></div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            const dropzone = document.getElementById('dropzone');
            const fileInput = document.getElementById('file');
            const fileName = document.getElementById('fileName');
            const toggleDot = document.getElementById('toggleDot');
            const themeIcon = document.getElementById('themeIcon');

            let selectedFile = null;
            let currentFileId = null;
            let eventSource = null;

            // Initialize Theme
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                updateThemeUI(true);
            } else {
                document.documentElement.classList.remove('dark');
                updateThemeUI(false);
            }

            function toggleDark() {
                const isDark = document.documentElement.classList.toggle('dark');
                localStorage.theme = isDark ? 'dark' : 'light';
                updateThemeUI(isDark);
            }

            function updateThemeUI(isDark) {
                if (isDark) {
                    toggleDot.style.transform = 'translateX(24px)';
                    themeIcon.className = 'fa-solid fa-moon text-[10px] text-indigo-400';
                } else {
                    toggleDot.style.transform = 'translateX(0px)';
                    themeIcon.className = 'fa-solid fa-sun text-[10px] text-amber-500';
                }
            }

            // Dropzone Logic
            dropzone.onclick = () => fileInput.click();
            dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('border-indigo-500', 'bg-indigo-50/50'); });
            dropzone.addEventListener('dragleave', () => { dropzone.classList.remove('border-indigo-500', 'bg-indigo-50/50'); });
            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('border-indigo-500', 'bg-indigo-50/50');
                selectedFile = e.dataTransfer.files[0];
                handleFileSelect();
            });
            fileInput.addEventListener('change', () => {
                selectedFile = fileInput.files[0];
                handleFileSelect();
            });

            function handleFileSelect() {
                if (selectedFile) {
                    fileName.innerHTML = `<i class="fa-solid fa-file-audio mr-2"></i>${selectedFile.name}`;
                }
            }

            async function cancel() {
                if (!currentFileId) return;
                const stopBtn = document.getElementById('stopBtn');
                stopBtn.disabled = true;
                stopBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i>Stopping...`;

                try {
                    await fetch(`/api/cancel/${currentFileId}`, { method: 'POST' });
                } catch (e) {
                    console.error('Cancel failed', e);
                }
            }

            async function upload() {
                if (!selectedFile) {
                    alert('กรุณาเลือกไฟล์ก่อนเริ่มงานครับ');
                    return;
                }

                const btn = document.getElementById('btn');
                const stopBtn = document.getElementById('stopBtn');
                const progressSection = document.getElementById('progressSection');
                const progressFill = document.getElementById('progressFill');
                const percentText = document.getElementById('percentText');
                const status = document.getElementById('status');
                const resultSection = document.getElementById('resultSection');
                const download = document.getElementById('download');
                const preview = document.getElementById('preview');

                const words = document.getElementById('words').value;
                const format = document.getElementById('format').value;
                const model = document.getElementById('model').value;
                const language = document.getElementById('language').value;

                // UI Reset
                btn.disabled = true;
                stopBtn.classList.remove('hidden');
                stopBtn.disabled = false;
                stopBtn.innerText = 'Stop';

                progressSection.classList.remove('hidden');
                resultSection.classList.add('hidden');
                progressFill.style.width = '2%';
                percentText.innerText = '2%';
                status.innerText = 'Uploading file...';

                try {
                    const formData = new FormData();
                    formData.append('file', selectedFile);

                    const uploadRes = await fetch('/api/upload', {
                        method: 'POST',
                        body: formData,
                    });

                    if (!uploadRes.ok) throw new Error('Upload failed');
                    
                    const { file_id } = await uploadRes.json();
                    currentFileId = file_id;
                    
                    const streamUrl = `/api/process/${file_id}?words_per_line=${words}&format_type=${format}&model_size=${model}&language=${language}`;
                    eventSource = new EventSource(streamUrl);

                    let isDone = false;
                    eventSource.onmessage = async (event) => {
                        const data = JSON.parse(event.data);

                        if (data.status === 'cancelled') {
                            status.innerText = 'หยุดการทำงานเรียบร้อยแล้ว';
                            eventSource.close();
                            resetUI();
                        } else if (data.error) {
                            status.innerText = 'Error: ' + data.error;
                            eventSource.close();
                            resetUI();
                        } else if (data.progress < 100) {
                            status.innerText = data.status || `ประมวลผล... (${data.progress}%)`;
                            progressFill.style.width = `${data.progress}%`;
                            percentText.innerText = `${data.progress}%`;
                        } else if (data.progress === 100 && data.download_url) {
                            isDone = true;
                            status.innerText = 'ถอดความสำเร็จ!';
                            progressFill.style.width = '100%';
                            percentText.innerText = '100%';
                            
                            download.href = data.download_url;
                            resultSection.classList.remove('hidden');

                            const previewRes = await fetch(data.download_url);
                            const text = await previewRes.text();
                            preview.innerText = text.substring(0, 2000);
                            
                            eventSource.close();
                            resetUI();
                        }
                    };

                    eventSource.onerror = (e) => {
                        eventSource.close();
                        resetUI();
                        if (!isDone) {
                            status.innerText = 'การเชื่อมต่อขัดข้อง กรุณาลองใหม่อีกครั้ง';
                        }
                    };

                } catch (e) {
                    status.innerText = 'Error: ' + e.message;
                    resetUI();
                }
            }

            function resetUI() {
                document.getElementById('btn').disabled = false;
                document.getElementById('stopBtn').classList.add('hidden');
                currentFileId = null;
            }
        </script>
    </body>
</html>
